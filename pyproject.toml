[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snitch-guardrail"
version = "0.1.0"
description = "Independent policy and execution gateway for AI agents"
requires-python = ">=3.11"

[project.scripts]
snitch = "snitch.cli:main"

[tool.setuptools.packages.find]
include = ["snitch*"]
